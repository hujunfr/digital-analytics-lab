
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Analytics Lab</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 760px;
      margin: 60px auto;
      padding: 20px;
      line-height: 1.7;
      color: #253047;
    }
    h1 { color: #1769aa; }
    button {
      background: #1769aa;
      color: white;
      border: 0;
      padding: 14px 22px;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>

  <!-- Matomo -->
  <script>
    var _paq = window._paq = window._paq || [];
    _paq.push(['trackPageView']);
    _paq.push(['enableLinkTracking']);
    (function() {
      var u="https://googlehujun.matomo.cloud/";
      _paq.push(['setTrackerUrl', u+'matomo.php']);
      _paq.push(['setSiteId', '1']);
      var d=document, g=d.createElement('script'),
          s=d.getElementsByTagName('script')[0];
      g.async=true;
      g.src='https://cdn.matomo.cloud/googlehujun.matomo.cloud/matomo.js';
      s.parentNode.insertBefore(g,s);
    })();
  </script>
  <!-- End Matomo Code -->
</head>

<body>
  <h1>Digital Analytics Lab</h1>
  <p>Welcome to our Digital Analytics teaching experiment.</p>

  <h2>What can we measure?</h2>
  <p>Pageviews, visitors, traffic sources and user interactions.</p>

  <button id="demo-button">Click to test Event Tracking</button>
  <p id="result"></p>

  <script>
    document.getElementById('demo-button')
      .addEventListener('click', function() {
        _paq.push([
          'trackEvent',
          'Teaching Demo',
          'Button Click',
          'Test Button'
        ]);
        document.getElementById('result').textContent =
          'Event sent to Matomo!';
      });
  </script>
</body>
</html>
